<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fake GPS — Subscribe</title>
  <style>
    :root { --bg:#0b1020; --card:#151b30; --fg:#eef1f7; --muted:#9aa4bf; --accent:#5b8cff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:radial-gradient(1200px 600px at 50% -10%, #1b2446, #0b1020);
           color:var(--fg); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; padding:24px; }
    .card { background:var(--card); border:1px solid #232c4a; border-radius:20px; padding:32px;
            max-width:420px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.4); }
    h1 { margin:0 0 6px; font-size:26px; }
    p.sub { margin:0 0 24px; color:var(--muted); }
    .price { font-size:40px; font-weight:800; margin:8px 0 2px; }
    .price span { font-size:16px; color:var(--muted); font-weight:500; }
    ul { list-style:none; padding:0; margin:20px 0 26px; }
    li { padding:8px 0; color:#cdd5ee; display:flex; gap:10px; align-items:center; }
    li::before { content:"✓"; color:var(--accent); font-weight:800; }
    button { width:100%; border:0; border-radius:12px; padding:15px; font-size:16px; font-weight:700;
             background:var(--accent); color:white; cursor:pointer; transition:.15s; }
    button:hover { filter:brightness(1.08); }
    button:disabled { opacity:.6; cursor:default; }
    .note { margin-top:16px; font-size:12px; color:var(--muted); text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Fake GPS Pro</h1>
    <p class="sub">Set your location anywhere on the map.</p>
    <div class="price">$9.99 <span>/ month</span></div>
    <ul>
      <li>Pick any point on the map</li>
      <li>Runs in the background</li>
      <li>Login emailed instantly after payment</li>
      <li>Cancel anytime</li>
    </ul>
    <button id="buy">Subscribe &amp; get login</button>
    <p class="note">After payment, your login details are emailed to you automatically.</p>
  </div>

  <script>
    const btn = document.getElementById("buy");
    btn.addEventListener("click", async () => {
      btn.disabled = true; btn.textContent = "Redirecting…";
      try {
        const r = await fetch("/api/create-checkout-session", { method: "POST" });
        const data = await r.json();
        if (data.url) { window.location = data.url; }
        else { alert("Could not start checkout. Try again."); btn.disabled = false; btn.textContent = "Subscribe & get login"; }
      } catch (e) {
        alert("Network error. Try again."); btn.disabled = false; btn.textContent = "Subscribe & get login";
      }
    });
  </script>
</body>
</html>
